<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Área de Lucha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#07020D; --text:#E1DDF6; --muted:rgba(225,221,246,.72);
      --blue:#3796F4; --magenta:#E047A4;
    }
    *{box-sizing:border-box}
    body{margin:0; color:var(--text); font-family:"Space Grotesk",system-ui; background:var(--bg); overflow-x:hidden;}
    .bg{position:fixed; inset:-200px; z-index:-1; pointer-events:none;
      background:
        radial-gradient(700px 320px at 20% 30%, rgba(55,150,244,.22), transparent 60%),
        radial-gradient(650px 300px at 80% 28%, rgba(224,71,164,.20), transparent 60%),
        radial-gradient(900px 500px at 50% 110%, rgba(255,255,255,.06), transparent 60%);
      filter: blur(12px);
    }
    .wrap{width:min(1120px,92vw); margin:0 auto; padding:36px 0;}
    h1{font-family:"Orbitron",system-ui; margin:0 0 10px; font-size:clamp(28px,3.2vw,46px); line-height:1.05;}
    p{margin:0 0 18px; color:var(--muted); font-size:16.5px; line-height:1.5; max-width:65ch;}
    .cta{display:flex; gap:10px; flex-wrap:wrap}
    a.btn{display:inline-flex; padding:11px 14px; border-radius:999px; text-decoration:none; color:var(--text);
      border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.03); font-weight:700;}
    a.btn.blue{border-color:rgba(55,150,244,.35)}
    a.btn.magenta{border-color:rgba(224,71,164,.35)}
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <h1>Área de Lucha</h1>
    <p>El hub de combate que mezcla técnica, data y calle. Videos, reels y streams en un solo lugar.</p>
    <div class="cta">
      <a class="btn blue" href="#" target="_blank" rel="noreferrer">YouTube</a>
      <a class="btn magenta" href="#" target="_blank" rel="noreferrer">Instagram</a>
      <a class="btn" href="#" target="_blank" rel="noreferrer">Kick</a>
    </div>
  </div>
</body>
</html>
